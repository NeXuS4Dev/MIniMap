name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore MIniMap/MIniMap.csproj

      - name: Build
        run: dotnet build MIniMap/MIniMap.csproj -c Release --no-restore

      - name: Upload MIniMap.dll
        uses: actions/upload-artifact@v4
        with:
          name: MIniMap-${{ github.sha }}
          path: MIniMap/bin/Release/netstandard2.1/MIniMap.dll
          if-no-files-found: error
